name: Feature Request
description: Suggest an idea or enhancement for the Antigravity plugin
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have a feature idea or architectural improvement? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or workflow limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
