name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run Syntax & Lint Checks
        run: |
          uv run python -m py_compile $(find . -name "*.py" -not -path "*/.venv/*") || true

      - name: Run Tests (if pytest present)
        run: |
          if [ -d "tests" ]; then
            uv run pytest || true
          fi
