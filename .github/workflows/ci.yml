name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Node.js ${{ matrix.node-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Test Suite
        run: npm test

      - name: Release guardrails (versions in sync, bumped when the plugin changed)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/release-check.mjs --base "origin/${{ github.base_ref }}"
          else
            node tools/release-check.mjs
          fi

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate Plugin & Marketplace Manifests
        run: |
          claude plugin validate plugins/antigravity
          claude plugin validate .claude-plugin/marketplace.json
